{% extends 'base.html' %}

{% block content %}

<div class="mx-auto max-w-xl">
    <div class="mb-8 text-center">
        <h2 class="text-3xl font-bold text-white">Registro de usuario</h2>
        <p class="mt-2 text-slate-400">
            Crea una cuenta para acceder al sistema académico.
        </p>
    </div>

    <div class="form-card rounded-3xl border border-white/10 bg-white/10 p-8 shadow-2xl backdrop-blur">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="mt-4 w-full rounded-2xl bg-sky-500 px-5 py-3 font-bold text-white shadow-lg shadow-sky-500/25 transition hover:bg-sky-400">
                Registrarse
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-400">
            ¿Ya tienes cuenta?
            <a href="{% url 'login' %}" class="font-semibold text-sky-300 hover:text-sky-200">
                Inicia sesión
            </a>
        </p>
    </div>
</div>

{% endblock %}
