{% extends 'base.html' %}

{% block content %}

<div class="mx-auto max-w-2xl">
    <div class="mb-8">
        <p class="mb-2 text-sm font-semibold uppercase tracking-[0.25em] text-amber-300">
            Actualización
        </p>

        <h2 class="text-4xl font-black text-white">
            Editar calificación
        </h2>

        <p class="mt-3 text-slate-400">
            Modifica los datos del estudiante. El promedio se actualizará automáticamente al guardar.
        </p>
    </div>

    <div class="form-card rounded-3xl border border-white/10 bg-white/10 p-8 shadow-2xl backdrop-blur">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="mt-6 flex gap-3">
                <button type="submit" class="rounded-2xl bg-amber-500 px-6 py-3 font-bold text-white shadow-lg shadow-amber-500/25 transition hover:bg-amber-400">
                    Actualizar
                </button>

                <a href="{% url 'listar_calificaciones' %}" class="rounded-2xl bg-white/10 px-6 py-3 font-bold text-slate-200 transition hover:bg-white/20">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
